{% extends 'layout/manage.html' %}
{% load wiki %}

{% block content %}
    <div class="container-fluid mt-4">

        <div class="card shadow-sm">

            <div class="card-header bg-light py-2">
                <i class="fa-solid fa-cloud"></i>wiki知识库
            </div>

            <div class="card-body p-0">
                <div class="row g-0" style="min-height: 85vh;">
                    <div class="col-md-3 border-end p-3 bg-light">
                        {% all_catalog request%}
                    </div>

                    <div class="col-md-9 p-4">
                        <div style="text-align: center; margin-top: 50px">
                            <form action="" method="post">
                                {% csrf_token %}
                                {% for field in form %}
                                    <div class="mb-3">
                                        <label for="{{ field.id_for_label }}"
                                               class="form-label">{{ field.label }}</label>
                                        {{ field }}
                                        <!-- 普通输入框下方错误信息块 -->
                                        <span class='err-msg'>{{ field.errors.0 }}</span>
                                    </div>
                                {% endfor %}
                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg" id="reg_btn">提交</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
{% endblock %}
