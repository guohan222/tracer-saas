{% extends 'layout/manage.html' %} {% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'plugin/flatpickr/flatpickr.min.css' %}">
    <style>
        /* 稍微美化一下日期输入框 */
        .date-picker-wrap {
            margin-bottom: 20px;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container-fluid" style="margin-top: 20px;">

        <div class="row date-picker-wrap">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text">日期范围</span>
                    <input type="text" id="dateRange" class="form-control" placeholder="请选择日期范围...">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header"><i class="fa fa-bar-chart"></i> 人员工作进度</div>
                    <div class="card-body">
                        <div id="projectChart" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><i class="fa fa-pie-chart"></i> 优先级统计</div>
                    <div class="card-body">
                        <div id="priorityChart" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
{% endblock %}


{% block js %}
    <script src="{% static 'plugin/highcharts/highcharts.js' %}"></script>
    <script src="{% static 'plugin/flatpickr/flatpickr.min.js' %}"></script>
    <script src="{% static 'plugin/flatpickr/l10n/zh.js' %}"></script>
    <script>
        // 全局图表变量
        let projectChart, priorityChart;

        let priorityUrl = '{% url 'web:statistics_priority' proj_id=request.tracer.project.id %}'
        let userUrl = '{% url 'web:statistics_user' proj_id=request.tracer.project.id %}'

        document.addEventListener('DOMContentLoaded', function () {
            initDatePicker()
            initProjectChart()
            initPriorityChart()
        })

        // 1. 初始化日期选择器 (Flatpickr)
        function initDatePicker() {
            flatpickr("#dateRange", {
                mode: "range",
                locale: "zh",
                onChange: function (selectedDates, dateStr, instance) {
                    // 当用户选好两个日期后，触发查询
                    if (selectedDates.length === 2) {
                        let start = flatpickr.formatDate(selectedDates[0], "Y-m-d");
                        let end = flatpickr.formatDate(selectedDates[1], "Y-m-d");
                        fetchData(start, end); // 带上时间去后端要数据
                    }
                }
            });
        }


        // 2. 初始化左侧：人员进度柱状堆叠图
        function initProjectChart() {
            projectChart = Highcharts.chart('projectChart', {
                chart: {type: 'column'}, // 柱状图
                title: {text: null},
                credits: {enabled: false},

                xAxis: {categories: []}, // 预留给人员名字: ['武沛齐', '未指派']
                yAxis: {
                    title: {text: '问题数量'},
                    allowDecimals: false
                },

                plotOptions: {
                    column: {
                        stacking: 'normal' // 开启堆叠效果 (核心配置)
                    }
                },
                series: [] // 预留给后端数据: [{name: '新建', data: [1, 2]}, {name: '处理中', data: [0, 1]}]
            });
        }


        // 3. 初始化右侧：优先级饼图
        function initPriorityChart() {
            priorityChart = Highcharts.chart('priorityChart', {
                chart: {type: 'pie'}, // 饼图
                title: {text: null},
                credits: {enabled: false},
                plotOptions: {
                    pie: {
                        allowPointSelect: true,
                        cursor: 'pointer',
                        dataLabels: {enabled: false}, // 关掉周围乱七八糟的连线
                        showInLegend: true // 显示底部图例
                    }
                },
                series: [{
                    name: '数量',
                    colorByPoint: true,
                    data: [] // 预留给后端数据: [{name: '高', y: 10}, {name: '中', y: 5}]
                }]
            });
        }

        // 4. 前后端通信中心
        async function fetchData(start = "", end = "") {
            let url1 = `${priorityUrl}?start=${start}&end=${end}`;
            let url2 = `${userUrl}?start=${start}&end=${end}`;

            // 使用 Promise.all 发起：并发请求
            let [res_priority, res_user] = await Promise.all([
                fetch(url1),
                fetch(url2),
            ])

            // 同时解析
            let data_priority = await res_priority.json()
            let data_user = await res_user.json()


            // 更新 projectChart 和 priorityChart 的数据
            if (data_priority.status) {
                priorityChart.series[0].setData(data_priority.priority_data)
            }

            // 更新柱状图 (究极优雅版)
            if (data_user.status) {
                projectChart.update({
                    xAxis: {categories: data_user.categories},
                    series: data_user.series
                }, true, true);
                // 解释：最后这个 true 是核心，学名叫 oneToOne (一对一映射)。
                // 它会自动对比新旧数据，帮你把多余的柱子全清掉，缺少的柱子补上，还自带极其丝滑的动画！
            }


        }


    </script>

{% endblock %}
